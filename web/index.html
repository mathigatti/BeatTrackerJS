<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeatTrackerJS — live beat tracking in the browser</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>BeatTrackerJS</h1>
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span id="statusText">not started</span>
        </div>
      </header>

      <!-- The first action. Swapped for the compact source bar once connected. -->
      <section class="onboarding" id="onboarding">
        <p class="lead">Choose <strong>one</strong> audio source</p>
        <div class="choices">
          <button class="choice" id="startBtn" type="button">
            <span class="choice-icon">🎤</span>
            <span class="choice-title">Listen to input</span>
            <span class="choice-desc">
              Microphone, or your system's audio monitor. For music playing in
              the room or on this computer.
            </span>
          </button>
          <button class="choice" id="tabBtn" type="button">
            <span class="choice-icon">🔊</span>
            <span class="choice-title">Tab audio</span>
            <span class="choice-desc">
              Audio straight from another browser tab, no microphone involved.
              Pick the tab and tick <em>share audio</em>.
            </span>
          </button>
        </div>
      </section>

      <section class="sourcebar" id="sourcebar" hidden>
        <label class="field grow">
          <span>source</span>
          <select id="deviceSelect"></select>
        </label>
        <button id="tabBtn2" type="button" class="ghost">🔊 Tab audio</button>
      </section>

      <section class="stage" aria-label="beat phase and dancer">
        <div class="ring-wrap" id="ringWrap">
          <svg class="phase-ring" viewBox="0 0 240 240" role="img" aria-label="phase ring">
            <circle class="ring-track" cx="120" cy="120" r="98"></circle>
            <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="98"></circle>
            <circle class="ring-pulse" id="ringPulse" cx="120" cy="120" r="76"></circle>
          </svg>
          <div class="readout">
            <div class="bpm" id="bpm">--.-</div>
            <div class="unit">BPM</div>
          </div>
        </div>

        <!-- Arms swing on every beat, hips and legs shift once per bar. -->
        <div class="dancer" id="dancer" data-beat="0" data-bar="0">
          <svg viewBox="0 0 200 250" role="img" aria-label="robot dancing to the beat">
            <g class="bot">
              <g class="arm arm-l">
                <rect x="34" y="96" width="16" height="60" rx="8"></rect>
                <circle class="hand" cx="42" cy="158" r="10"></circle>
              </g>
              <g class="arm arm-r">
                <rect x="150" y="96" width="16" height="60" rx="8"></rect>
                <circle class="hand" cx="158" cy="158" r="10"></circle>
              </g>
              <g class="hips">
                <g class="leg leg-l">
                  <rect x="72" y="168" width="18" height="58" rx="9"></rect>
                  <rect class="foot" x="64" y="222" width="34" height="14" rx="7"></rect>
                </g>
                <g class="leg leg-r">
                  <rect x="110" y="168" width="18" height="58" rx="9"></rect>
                  <rect class="foot" x="102" y="222" width="34" height="14" rx="7"></rect>
                </g>
              </g>
              <rect class="torso" x="60" y="92" width="80" height="82" rx="18"></rect>
              <rect class="chest-light" x="88" y="116" width="24" height="24" rx="6"></rect>
              <g class="head">
                <rect x="58" y="26" width="84" height="62" rx="18"></rect>
                <circle class="eye eye-l" cx="82" cy="56" r="9"></circle>
                <circle class="eye eye-r" cx="118" cy="56" r="9"></circle>
                <rect class="antenna" x="97" y="4" width="6" height="22" rx="3"></rect>
                <circle class="antenna-tip" cx="100" cy="6" r="7"></circle>
              </g>
            </g>
          </svg>
        </div>
      </section>

      <section class="sequencer" aria-label="bar">
        <div class="steps" id="steps"></div>
      </section>

      <section class="bottombar">
        <label class="field">
          <span>meter</span>
          <select id="meterSelect">
            <option value="">Auto</option>
            <option value="2">2/4</option>
            <option value="3">3/4</option>
            <option value="4">4/4</option>
            <option value="5">5/4</option>
            <option value="6">6/8</option>
          </select>
        </label>
        <div class="confidence">
          <div class="confidence-head">
            <span>confidence</span>
            <strong id="confidenceLabel">0%</strong>
          </div>
          <div class="bar"><div id="confidenceBar"></div></div>
        </div>
        <button id="resetBtn" type="button" class="ghost">Reset</button>
      </section>

      <details class="advanced">
        <summary>Details</summary>
        <div class="advanced-body">
          <div class="datum">
            <span>next beat</span>
            <strong><span id="nextBeat">---</span> ms</strong>
          </div>
          <div class="datum">
            <span>activation</span>
            <strong id="activation">0.00</strong>
          </div>
          <div class="datum">
            <span>CPU per hop</span>
            <strong><span id="cpu">--</span> ms</strong>
          </div>
          <div class="datum">
            <span>downbeat</span>
            <strong id="downbeat">--</strong>
          </div>
          <div class="nudge">
            <button id="nudgeBtn" type="button" class="ghost">The 1 is here</button>
            <p class="hint">
              Tap it on a downbeat when the detected 1 sits on the wrong beat.
            </p>
          </div>
        </div>
      </details>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
